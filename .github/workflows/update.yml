name: Update data and deploy

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours; picks up each Challenge once Videre has it
  workflow_dispatch:
    inputs:
      reprocess:
        description: "Event ids to re-fetch (comma-separated, last 3 weeks only)"
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch new Challenges from Videre
        if: github.event_name != 'push'
        run: node scripts/update.mjs
        env:
          REPROCESS: ${{ github.event.inputs.reprocess }}

      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Build site
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
